name: annur-local
services:
  database:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Jalankan npm run setup:local}
      MARIADB_DATABASE: annur
      MARIADB_USER: annur
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Jalankan npm run setup:local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  database-test:
    image: mariadb:11.8
    profiles: [test]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Jalankan npm run setup:local}
      MARIADB_DATABASE: annur_test
      MARIADB_USER: annur
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Jalankan npm run setup:local}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - database-test:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  database:
  database-test:
